<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping list</title>
    <link rel="stylesheet" href="styles.css">

</head>
<body>
    <h1>Interactive Shopping list</h1>
 
    <form>
    <section>
        <h2>Add item</h2>
        <label for="itemName">Name:</label>
        <input type="text" id="itemname" placeholder="Enter item" required> 

     <label>Price:</label>
     <input  id="itemprice" type="number" placeholder="Price" required> 

      <button id="addButton">Add items</button>  
      
    <h3> Shopping items</h3>
    <ul id="shoppinglist"></ul>  

    <button id="markPurchased" >Mark Purchased</button>

  

  
   <h3 id="totalcost">Total cost: KSh 0.00</h3>

  <button id="clearlist" >Clearlist</button>

  
  </section>
  </form>

  <footer>&copy;Shopping list.All rights resrved.</footer>

    <script src="index.js"></script>
</body>

</html>
